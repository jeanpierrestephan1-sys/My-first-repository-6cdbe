<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turkey Bowl Pool 2026</title>
<meta name="theme-color" content="#1b130e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<style>
:root{--bg:#1b130e;--card:#2a1e16;--card2:#34261c;--line:#4a382b;--ink:#f6ead9;--mute:#b9a48d;--acc:#f08a3c;--acc2:#ffc46b;--win:#6fcf7f;--loss:#e86a5c;--push:#d9c46a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 14px calc(40px + env(safe-area-inset-bottom))}
header{padding:22px 0 10px;text-align:center}
h1{font:700 30px/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:.3px}
h1 span{color:var(--acc)}
.sub{color:var(--mute);font-size:13px;margin-top:6px}
.pot{display:flex;gap:8px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--mute)}
.pill b{color:var(--acc2);font-size:15px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
nav button{flex:1;background:none;border:1px solid transparent;color:var(--mute);font:600 14px inherit;padding:10px 4px;border-radius:10px;cursor:pointer}
nav button.on{background:var(--card);border-color:var(--line);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font:700 13px inherit;text-transform:uppercase;letter-spacing:1.2px;color:var(--acc2);margin:20px 2px 8px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);margin-bottom:10px;gap:8px}
.lg{font-weight:700;font-size:11px;padding:2px 7px;border-radius:5px;background:#3d2c20;color:var(--acc2);margin-right:6px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side{background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:12px 8px;color:var(--ink);font:inherit;cursor:pointer;text-align:center;min-height:64px}
.side .t{font-weight:700;font-size:16px;display:block}
.side .s{font-size:14px;color:var(--mute)}
.side.sel{border-color:var(--acc);background:#4a2d18}
.side.sel .s{color:var(--acc2)}
.side:disabled{cursor:default;opacity:.75}
.side.w{border-color:var(--win)}.side.l{border-color:var(--loss)}.side.p{border-color:var(--push)}
.foot{font-size:12px;color:var(--mute);margin-top:9px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.final{color:var(--ink);font-weight:600}
.tb{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:10px;font-size:14px}
.tb label{flex:1;color:var(--acc2)}
input,select{background:#1b130e;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 12px;font:16px inherit;width:100%}
.tb input{width:86px;text-align:center}
.btn{background:var(--acc);color:#221308;border:0;border-radius:10px;padding:12px 16px;font:700 15px inherit;cursor:pointer;width:100%}
.btn.sm{width:auto;padding:7px 11px;font-size:13px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--mute)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:10px 6px;border-bottom:1px solid #3a2b20}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.rk{color:var(--mute);width:26px}
tr.lead td{background:#3a2616}
tr.lead .nm{color:var(--acc2)}
.nm{font-weight:700}
.me{font-size:10px;color:var(--acc);border:1px solid var(--acc);border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:middle}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--loss);margin-left:6px}
.dot.ok{background:var(--win)}
.chips{display:flex;gap:6px;margin-bottom:10px}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:6px 14px;font:600 13px inherit;cursor:pointer}
.chips button.on{background:var(--acc);color:#221308;border-color:var(--acc)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.grid td,.grid th{white-space:nowrap;text-align:center;padding:8px 7px;font-size:13px}
.grid td:first-child,.grid th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.gw{color:var(--win);font-weight:700}.gl{color:var(--loss)}.gp{color:var(--push)}.gh{color:#6b5847}
.note{font-size:13px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#f6ead9;color:#221308;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.hide{display:none}
ul.rules{margin:6px 0 0;padding-left:18px;color:var(--mute);font-size:13px}
ul.rules li{margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Turkey Bowl <span>Pool</span></h1>
    <div class="sub">Thanksgiving week 2026 · 4 NFL + 10 college · against the spread</div>
    <div class="pot" id="pot"></div>
  </header>
  <nav id="nav">
    <button data-t="picks" class="on">My Picks</button>
    <button data-t="board">Leaders</button>
    <button data-t="all">Everyone</button>
    <button data-t="admin">Commish</button>
  </nav>
  <main id="main"><div class="card note">Loading…</div></main>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mem = {};
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return mem[k] ?? null; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch {} },
  del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch {} },
};
let S = null, tab = "picks", league = "ALL", adminCode = ls.get("tb_admin") || "";
let me = { name: ls.get("tb_name") || "", pin: ls.get("tb_pin") || "" };

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 1800); }
async function api(path, body) {
  const r = await fetch("/api/" + path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
  const d = await r.json().catch(() => ({ error: "Server error" }));
  if (!r.ok) throw new Error(d.error || "Server error");
  return d;
}
async function load(silent) {
  try {
    S = await api(`state?name=${encodeURIComponent(me.name)}&pin=${encodeURIComponent(me.pin)}`);
    S.skew = S.now - Date.now();
    render();
  } catch (e) { if (!silent) $("#main").innerHTML = `<div class="card note">Couldn't reach the pool: ${esc(e.message)}</div>`; }
}
const now = () => Date.now() + (S?.skew || 0);
const isLocked = (g) => now() >= Date.parse(g.ko);
const fmtKo = (g) => new Date(g.ko).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
const sp = (n) => (n > 0 ? "+" + n : n === 0 ? "PK" : String(n));
const spreadFor = (g, side) => sp(side === "home" ? g.spread : -g.spread);

// Which side covered: "home" | "away" | "push" | null (not final)
function cover(g) {
  const r = S.results[g.id];
  if (!r || !r.final) return null;
  const m = r.home - r.away + g.spread;
  return m > 0 ? "home" : m < 0 ? "away" : "push";
}
function standings(lg) {
  const games = S.games.filter((g) => lg === "ALL" || g.lg === lg);
  const tbActual = {};
  for (const g of S.games) if (g.tb && S.results[g.id]?.final) tbActual[g.tb] = S.results[g.id].home + S.results[g.id].away;
  const rows = S.players.map((p) => {
    let w = 0, l = 0, ps = 0;
    for (const g of games) {
      const c = cover(g); if (!c) continue;
      if (c === "push") { ps++; continue; }
      if (p.picks[g.id] === c) w++; else l++;   // no pick on a finished game counts as a loss
    }
    const d = (k) => (tbActual[k] != null && p.tb[k] != null ? Math.abs(p.tb[k] - tbActual[k]) : null);
    return { p, w, l, ps, pts: w + ps * 0.5, d1: d("tb1"), d2: d("tb2") };
  });
  const inf = (v) => (v == null ? 1e9 : v);
  rows.sort((a, b) => b.pts - a.pts || inf(a.d1) - inf(b.d1) || inf(a.d2) - inf(b.d2) || a.p.name.localeCompare(b.p.name));
  rows.forEach((r, i) => {
    const prev = rows[i - 1];
    r.rank = prev && prev.pts === r.pts && inf(prev.d1) === inf(r.d1) && inf(prev.d2) === inf(r.d2) ? prev.rank : i + 1;
  });
  return { rows, tbActual, done: games.filter(cover).length, total: games.length };
}

function renderPot() {
  const n = S.players.length, entry = S.games.length * S.perGame;
  const next = S.games.find((g) => !isLocked(g));
  $("#pot").innerHTML =
    `<div class="pill">Pot <b>$${n * entry}</b></div><div class="pill"><b>${n}</b>/${S.max} in · $${entry} each</div>` +
    (next ? `<div class="pill">Next lock <b>${esc(next.away)}–${esc(next.home)}</b> ${fmtKo(next)}</div>` : `<div class="pill">All games locked</div>`);
}

function viewLogin() {
  return `<div class="card">
    <div style="font-weight:700;font-size:17px;margin-bottom:4px">Join the pool</div>
    <div class="note" style="margin-bottom:12px">Pick a name and a 4-digit PIN. Use the same two to get back in from any phone.</div>
    <div class="row" style="margin-bottom:10px"><input id="lname" placeholder="Your name" maxlength="18" autocomplete="nickname"><input id="lpin" placeholder="PIN" inputmode="numeric" maxlength="4" style="max-width:110px"></div>
    <button class="btn" id="ljoin">Let me in</button>
  </div>${rules()}`;
}
function rules() {
  const tb = S.games.filter((g) => g.tb).map((g) => `${esc(g.away)}–${esc(g.home)}`);
  return `<div class="card"><div style="font-weight:700">How it works</div><ul class="rules">
    <li>$${S.perGame} a game, ${S.games.length} games — $${S.games.length * S.perGame} a head. Winner takes the pot.</li>
    <li>Pick every game against the spread. Lines are frozen as of ${esc(S.linesAsOf)}.</li>
    <li>A win is 1 point, a push is ½. Each pick locks at kickoff, and nobody sees your pick until it locks.</li>
    <li>Tiebreakers: closest guess to total points in ${tb[0]}, then ${tb[1]}.</li>
  </ul></div>`;
}

function viewPicks() {
  const p = S.players.find((x) => x.id === S.me);
  if (!p) return viewLogin();
  let html = `<div class="meta" style="margin:0 2px 4px"><span>Signed in as <b style="color:var(--ink)">${esc(p.name)}</b> · ${p.made}/${S.games.length} picked</span><button class="btn sm ghost" id="logout">Sign out</button></div>`;
  let day = "";
  for (const g of S.games) {
    if (g.day !== day) { day = g.day; html += `<h2>${day}</h2>`; }
    const lock = isLocked(g), c = cover(g), r = S.results[g.id], mine = p.picks[g.id];
    const cls = (side) => {
      let k = "side"; if (mine === side) { k += " sel"; if (c) k += c === "push" ? " p" : c === side ? " w" : " l"; }
      return k;
    };
    const btn = (side) => `<button class="${cls(side)}" data-g="${g.id}" data-s="${side}" ${lock ? "disabled" : ""}><span class="t">${esc(g[side])}</span><span class="s">${spreadFor(g, side)}</span></button>`;
    html += `<div class="card"><div class="meta"><span><span class="lg">${g.lg}</span>${fmtKo(g)}${g.tv ? " · " + g.tv : ""}</span><span>${lock ? "🔒 Locked" : "O/U " + g.total}</span></div>
      <div class="sides">${btn("away")}${btn("home")}</div>
      <div class="foot"><span>${esc(g.away)} at ${esc(g.home)}</span>${r?.final ? `<span class="final">Final ${r.away}–${r.home}${mine ? (c === "push" ? " · Push" : c === mine ? " · ✓" : " · ✗") : " · no pick"}</span>` : lock ? `<span>${mine ? "In progress" : "No pick made"}</span>` : ""}</div>
      ${g.tb ? `<div class="tb"><label>Tiebreaker ${g.tb === "tb1" ? 1 : 2}: total points in this game (O/U ${g.total})</label><input type="number" inputmode="numeric" min="0" max="200" data-tb="${g.tb}" value="${p.tb[g.tb] ?? ""}" ${lock ? "disabled" : ""} placeholder="—"></div>` : ""}
    </div>`;
  }
  return html + rules();
}

function viewBoard() {
  const { rows, tbActual, done, total } = standings(league);
  const chip = (k, t) => `<button class="${league === k ? "on" : ""}" data-lg="${k}">${t}</button>`;
  if (!S.players.length) return `<div class="card note">Nobody's in yet. Be first.</div>`;
  const body = rows.map((r) => `<tr class="${r.rank === 1 && done ? "lead" : ""}">
      <td class="rk">${done ? r.rank : "–"}</td>
      <td><span class="nm">${esc(r.p.name)}</span>${r.p.id === S.me ? '<span class="me">YOU</span>' : ""}<span class="dot ${r.p.paid ? "ok" : ""}" title="${r.p.paid ? "Paid" : "Owes"}"></span></td>
      <td class="n">${r.w}-${r.l}${r.ps ? "-" + r.ps : ""}</td><td class="n"><b>${r.pts}</b></td>
      <td class="n">${r.d1 ?? "–"}</td><td class="n">${r.d2 ?? "–"}</td></tr>`).join("");
  return `<div class="chips">${chip("ALL", "Overall")}${chip("NFL", "NFL")}${chip("CFB", "College")}</div>
    <div class="card"><div class="meta"><span>${done} of ${total} games final</span><span>${league === "ALL" ? "Pot goes to #1 overall" : "Bragging rights only"}</span></div>
    <div class="scroll"><table><thead><tr><th></th><th>Player</th><th class="n">W-L-P</th><th class="n">Pts</th><th class="n">TB1</th><th class="n">TB2</th></tr></thead><tbody>${body}</tbody></table></div></div>
    <div class="note" style="padding:0 4px">TB1/TB2 = how far off each tiebreaker guess was (lower wins). Actual totals: ${tbActual.tb1 ?? "pending"} / ${tbActual.tb2 ?? "pending"}. <span class="dot ok"></span> paid <span class="dot"></span> owes.</div>`;
}

function viewAll() {
  if (!S.players.length) return `<div class="card note">Nobody's in yet.</div>`;
  const head = S.games.map((g) => `<th>${esc(g.away)}<br>${esc(g.home)} ${sp(g.spread)}</th>`).join("");
  const body = S.players.map((p) => `<tr><td><b>${esc(p.name)}</b></td>` + S.games.map((g) => {
    if (!isLocked(g)) return `<td class="gh">${p.id === S.me && p.picks[g.id] ? esc(g[p.picks[g.id]]) : "🔒"}</td>`;
    const pk = p.picks[g.id], c = cover(g);
    if (!pk) return `<td class="gl">—</td>`;
    return `<td class="${c ? (c === "push" ? "gp" : c === pk ? "gw" : "gl") : ""}">${esc(g[pk])}</td>`;
  }).join("") + `<td>${p.tb.tb1 ?? "🔒"} / ${p.tb.tb2 ?? "🔒"}</td></tr>`).join("");
  return `<div class="card"><div class="note" style="margin-bottom:8px">Picks show up here once each game kicks off. Green covered, red didn't.</div>
    <div class="scroll"><table class="grid"><thead><tr><th>Player</th>${head}<th>TB1 / TB2</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
}

function viewAdmin() {
  if (!adminCode) return `<div class="card"><div style="font-weight:700;margin-bottom:8px">Commissioner</div><div class="row"><input id="acode" placeholder="Commissioner code" autocapitalize="off"><button class="btn" id="ago" style="max-width:110px">Unlock</button></div></div>`;
  const games = S.games.map((g) => { const r = S.results[g.id];
    return `<tr><td>${esc(g.away)} at ${esc(g.home)}<div class="note">${r?.final ? (r.manual ? "entered by hand" : "auto from ESPN") : "no final yet"}</div></td>
    <td><input type="number" inputmode="numeric" data-ra="${g.id}" value="${r?.away ?? ""}" placeholder="${esc(g.away)}" style="width:70px;padding:8px"></td>
    <td><input type="number" inputmode="numeric" data-rh="${g.id}" value="${r?.home ?? ""}" placeholder="${esc(g.home)}" style="width:70px;padding:8px"></td>
    <td><button class="btn sm" data-save="${g.id}">Save</button></td></tr>`; }).join("");
  const players = S.players.map((p) => `<tr><td><b>${esc(p.name)}</b><div class="note">${p.made}/${S.games.length} picks</div></td>
    <td><button class="btn sm ${p.paid ? "" : "ghost"}" data-paid="${p.id}" data-v="${p.paid ? 0 : 1}">${p.paid ? "Paid ✓" : "Mark paid"}</button></td>
    <td><button class="btn sm ghost" data-pin="${p.id}">Reset PIN</button></td>
    <td><button class="btn sm ghost" data-rm="${p.id}" data-nm="${esc(p.name)}">Remove</button></td></tr>`).join("");
  return `<div class="card"><div style="font-weight:700">Final scores</div><div class="note" style="margin:4px 0 8px">Finals fill in automatically from ESPN a few hours after kickoff. Enter one here to override; clear both boxes and save to undo.</div><div class="scroll"><table>${games}</table></div></div>
    <div class="card"><div style="font-weight:700;margin-bottom:6px">Players (${S.players.length}/${S.max})</div><div class="scroll"><table>${players || '<tr><td class="note">None yet</td></tr>'}</table></div></div>
    <button class="btn ghost" id="aout">Lock commissioner tools</button>`;
}

function render() {
  if (!S) return;
  renderPot();
  const active = document.activeElement;
  if (active && active.tagName === "INPUT" && $("#main").contains(active) && render.auto) return; // don't clobber typing on background refresh
  $("#main").innerHTML = { picks: viewPicks, board: viewBoard, all: viewAll, admin: viewAdmin }[tab]();
}

$("#nav").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.t; [...$("#nav").children].forEach((x) => x.classList.toggle("on", x === b)); render();
});

async function admin(action, extra) {
  try { await api("admin", { code: adminCode, action, ...extra }); await load(); toast("Saved"); }
  catch (e) { toast(e.message); if (/code/i.test(e.message)) { adminCode = ""; ls.del("tb_admin"); render(); } }
}

$("#main").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "ljoin") {
    const name = $("#lname").value.trim(), pin = $("#lpin").value.trim();
    try { const r = await api("join", { name, pin }); me = { name: r.name, pin }; ls.set("tb_name", r.name); ls.set("tb_pin", pin); await load(); toast("You're in, " + r.name); }
    catch (err) { toast(err.message); }
  } else if (b.id === "logout") { me = { name: "", pin: "" }; ls.del("tb_name"); ls.del("tb_pin"); load();
  } else if (b.dataset.g) {
    const p = S.players.find((x) => x.id === S.me); if (!p) return;
    p.picks[b.dataset.g] = b.dataset.s; p.made = Object.keys(p.picks).length; render();
    try { const r = await api("picks", { ...me, picks: { [b.dataset.g]: b.dataset.s } }); if (r.rejected.length) { toast("Too late — that game is locked"); load(); } else toast("Pick saved"); }
    catch (err) { toast(err.message); load(); }
  } else if (b.dataset.lg) { league = b.dataset.lg; render();
  } else if (b.id === "ago") {
    const code = $("#acode").value.trim();
    try { await api("admin", { code, action: "check" }); adminCode = code; ls.set("tb_admin", code); render(); } catch (err) { toast(err.message); }
  } else if (b.id === "aout") { adminCode = ""; ls.del("tb_admin"); render();
  } else if (b.dataset.save) {
    const g = b.dataset.save, a = $(`[data-ra="${g}"]`).value, h = $(`[data-rh="${g}"]`).value;
    if (a === "" && h === "") admin("clearResult", { gid: g }); else admin("setResult", { gid: g, away: Number(a), home: Number(h) });
  } else if (b.dataset.paid) { admin("setPaid", { id: b.dataset.paid, paid: b.dataset.v === "1" });
  } else if (b.dataset.pin) { const pin = prompt("New 4-digit PIN for this player:"); if (pin) admin("resetPin", { id: b.dataset.pin, pin: pin.trim() });
  } else if (b.dataset.rm) { if (confirm(`Remove ${b.dataset.nm} and all their picks?`)) admin("removePlayer", { id: b.dataset.rm }); }
});
$("#main").addEventListener("change", async (e) => {
  const k = e.target.dataset.tb; if (!k) return;
  try { const r = await api("picks", { ...me, tb: { [k]: e.target.value } }); toast(r.rejected.length ? "Too late — locked" : "Tiebreaker saved"); load(true); }
  catch (err) { toast(err.message); }
});

load();
setInterval(() => { render.auto = true; load(true).finally(() => (render.auto = false)); }, 60000);
</script>
</body>
</html>
