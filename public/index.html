<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turkey Bowl Pool 2026</title>
<meta name="description" content="Family Thanksgiving football pool. Pick every game against the spread.">
<meta name="theme-color" content="#123c2c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<link rel="preload" href="/fonts/graduate.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Graduate;src:url(/fonts/graduate.woff2) format("woff2");font-display:swap}
@font-face{font-family:Barlow;font-weight:400;src:url(/fonts/barlow-400.woff2) format("woff2");font-display:swap}
@font-face{font-family:Barlow;font-weight:600;src:url(/fonts/barlow-600.woff2) format("woff2");font-display:swap}
@font-face{font-family:Barlow;font-weight:700;src:url(/fonts/barlow-700.woff2) format("woff2");font-display:swap}
:root{--turf:#123c2c;--turf2:#0c2b20;--chalk:#f2eedf;--chalk2:#e4dfcc;--ink:#14261d;--mute:#5d6b62;--cran:#a3173a;--gold:#e2b33c;--win:#1f8a4c;--loss:#b3261e;--line:#cfc9b3}
*{box-sizing:border-box}
html{background:var(--turf2)}
body{margin:0;color:var(--chalk);font:400 16px/1.45 Barlow,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;
  background:var(--turf) repeating-linear-gradient(180deg,transparent 0 118px,rgba(242,238,223,.07) 118px 120px);min-height:100vh}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom))}

header{padding:26px 2px 14px}
h1{font:400 34px/1 Graduate,Georgia,serif;margin:0;letter-spacing:.5px}
.tag{margin:8px 0 0;color:#c5d3c9;font-size:15px}
.board{display:grid;grid-template-columns:auto auto 1fr;margin-top:16px;border:2px solid var(--chalk);border-radius:6px;background:var(--turf2)}
.board div{padding:9px 12px;border-right:2px solid var(--chalk);min-width:0}
.board div:last-child{border-right:0}
.board small{display:block;font-size:12px;color:#a9bbaf}
.board b{font:400 22px/1.15 Graduate,Georgia,serif;color:var(--gold);white-space:nowrap}
.board .nx b{font:700 16px/1.25 Barlow,sans-serif;color:var(--chalk);display:block;white-space:normal;margin-top:2px}

h2{font:400 15px/1 Graduate,Georgia,serif;letter-spacing:1px;margin:26px 2px 10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;border-top:2px dashed rgba(242,238,223,.35)}

.card{background:var(--chalk);color:var(--ink);border-radius:10px;padding:14px;margin-bottom:12px}
.card p{margin:0 0 10px}
.card h3{font:700 18px/1.2 Barlow,sans-serif;margin:0 0 6px}
.note{font-size:14px;color:var(--mute)}
.onturf{color:#c5d3c9;font-size:14px;padding:0 2px}

.game{background:var(--chalk);color:var(--ink);border-radius:10px;margin-bottom:12px;overflow:hidden}
.game.todo{box-shadow:inset 5px 0 0 var(--gold)}
.gmeta{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}
.gmeta span:last-child{color:var(--mute);font-weight:400}
.duel{display:grid;grid-template-columns:1fr 1fr;position:relative}
.duel::after{content:"at";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--chalk);border:1px solid var(--line);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:11px;color:var(--mute);pointer-events:none}
.side{background:none;border:0;color:var(--ink);padding:14px 8px 12px;text-align:center;min-height:132px;position:relative}
.side+.side{border-left:1px solid var(--line)}
.side svg{width:68px;height:60px;display:block;margin:0 auto 6px}
.side .t{display:block;font-weight:700;font-size:17px;line-height:1.15}
.side .s{display:block;font:400 22px/1.2 Graduate,Georgia,serif;margin-top:3px}
.side .k{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;visibility:hidden}
.side.sel{background:var(--ink);color:var(--chalk)}
.side.sel .k{visibility:visible;background:var(--chalk);color:var(--ink)}
.side.sel.w .k{background:var(--win);color:#fff}
.side.sel.l .k{background:var(--loss);color:#fff}
.side.sel.p .k{background:var(--gold);color:var(--ink)}
.side:disabled{cursor:default}
.side:disabled:not(.sel){opacity:.55}
@media (hover:hover){.side:not(:disabled):not(.sel):hover{background:var(--chalk2)}}
.gfoot{padding:9px 14px;border-top:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:8px}
.gfoot b{font-weight:700}
.tb{padding:12px 14px;border-top:2px dashed var(--line);display:flex;align-items:center;gap:12px;background:var(--chalk2)}
.tb label{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.tb label span{display:block;font-weight:400;color:var(--mute)}
input{background:#fff;border:2px solid var(--ink);color:var(--ink);border-radius:8px;padding:11px 12px;font-size:16px;width:100%}
input:disabled{background:var(--chalk2);border-color:var(--line)}
.tb input{width:84px;text-align:center;font:400 20px Graduate,Georgia,serif;padding:8px}

.btn{background:var(--cran);color:#fff;border:0;border-radius:8px;padding:13px 16px;font-weight:700;font-size:16px;width:100%}
.btn.sm{width:auto;padding:8px 12px;font-size:14px}
.btn.line{background:none;border:2px solid var(--ink);color:var(--ink)}
.btn.turf{background:none;border:2px solid var(--chalk);color:var(--chalk)}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}

.prog{display:flex;align-items:center;gap:12px;margin:4px 2px 0}
.prog .bar{flex:1;height:10px;border:2px solid var(--chalk);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--gold)}
.prog span{font-weight:600;font-size:15px;white-space:nowrap}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 10px;font-size:15px}
.who button{background:none;border:0;color:var(--chalk);text-decoration:underline;padding:6px 0;font-size:14px}

table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:12px;font-weight:600;color:var(--mute);text-align:left;padding:6px;border-bottom:2px solid var(--ink)}
td{padding:11px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.n{text-align:right}
td.rk{font:400 18px Graduate,Georgia,serif;width:30px}
td.pts{font:400 20px Graduate,Georgia,serif}
tr.lead td{background:#f7e7b4}
.nm{font-weight:700}
.you{font-size:11px;font-weight:700;background:var(--ink);color:var(--chalk);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.owe{font-size:12px;color:var(--loss);font-weight:600;display:block}
.paid{font-size:12px;color:var(--win);font-weight:600;display:block}
.chips{display:flex;gap:8px;margin:0 0 12px}
.chips button{flex:1;background:none;border:2px solid var(--chalk);color:var(--chalk);border-radius:99px;padding:8px 6px;font-weight:600;font-size:15px}
.chips button.on{background:var(--chalk);color:var(--ink)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
.grid th,.grid td{white-space:nowrap;text-align:center;padding:8px 8px;font-size:13px}
.grid th{font-weight:600;line-height:1.25}
.grid th:first-child,.grid td:first-child{text-align:left;position:sticky;left:-14px;background:var(--chalk);padding-left:14px;font-size:15px;box-shadow:1px 0 0 var(--line)}
.gw{color:var(--win);font-weight:700}.gl{color:var(--loss);text-decoration:line-through}.gp{color:#8a6a00;font-weight:600}.gh{color:#a39d87}
ul.rules{margin:0;padding-left:18px;font-size:15px}
ul.rules li{margin-bottom:6px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--turf2);border-top:2px solid var(--chalk);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:0;color:#a9bbaf;font-weight:600;font-size:14px;padding:14px 2px 13px;border-top:4px solid transparent;margin-top:-2px}
nav button[aria-current=page]{color:var(--chalk);border-top-color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--chalk);color:var(--ink);border:2px solid var(--ink);padding:9px 16px;border-radius:99px;font-weight:700;font-size:15px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:9;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:359px){h1{font-size:28px}.side .t{font-size:15px}.side .s{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Turkey Bowl Pool</h1>
    <p class="tag" id="tag">Thanksgiving week 2026. Pick every game against the spread.</p>
    <div class="board" id="board" aria-live="polite"></div>
  </header>
  <main id="main"><p class="onturf">Loading the pool…</p></main>
</div>
<nav aria-label="Sections"><div id="nav">
  <button data-t="picks" aria-current="page">My picks</button>
  <button data-t="board">Standings</button>
  <button data-t="all">Everyone</button>
  <button data-t="admin">Commish</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mem = {};
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return mem[k] ?? null; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch {} },
  del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch {} },
};
// Helmet colors only: [shell, trim]. Plain helmets, no team marks.
const KIT = {
  Packers: ["#FFB612", "#203731"], Rams: ["#003594", "#FFD100"], Bears: ["#0B162A", "#C83803"], Lions: ["#0076B6", "#B0B7BC"],
  Eagles: ["#004C54", "#A5ACAF"], Cowboys: ["#B0B7BC", "#041E42"], Chiefs: ["#E31837", "#FFB81C"], Bills: ["#00338D", "#C60C30"],
  Broncos: ["#FB4F14", "#002244"], Steelers: ["#101820", "#FFB612"],
  Nebraska: ["#E41C38", "#FDF2D9"], Iowa: ["#111111", "#FFCD00"], Florida: ["#FA4616", "#0021A5"], "Florida State": ["#CEB888", "#782F40"],
  Texas: ["#FFFFFF", "#BF5700"], "Texas A&M": ["#500000", "#FFFFFF"], Michigan: ["#00274C", "#FFCB05"], "Ohio State": ["#A7B1B7", "#BB0000"],
  "South Carolina": ["#73000A", "#FFFFFF"], Clemson: ["#F56600", "#522D80"], "Penn State": ["#FFFFFF", "#041E42"], Maryland: ["#E03A3E", "#FFD520"],
  Pitt: ["#003594", "#FFB81C"], Cal: ["#003262", "#FDB515"], Auburn: ["#FFFFFF", "#E87722"], Alabama: ["#9E1B32", "#FFFFFF"],
  "Notre Dame": ["#C99700", "#0C2340"], Syracuse: ["#F76900", "#000E54"], Washington: ["#4B2E83", "#B7A57A"], Oregon: ["#154733", "#FEE123"],
};
function helmet(team, faceLeft) {
  const [c1, c2] = KIT[team] || ["#8a8f8c", "#f2eedf"];
  return `<svg viewBox="0 0 68 60" aria-hidden="true"${faceLeft ? ' style="transform:scaleX(-1)"' : ""}>
    <path d="M5 35C5 16 19 5 36 5c15 0 24 10 24 23v5H42c-4 0-6 3-6 7v8H17C10 48 5 43 5 35z" fill="${c1}" stroke="#14261d" stroke-width="2" stroke-linejoin="round"/>
    <path d="M11 24C17 13 27 8 40 8" fill="none" stroke="${c2}" stroke-width="5" stroke-linecap="round"/>
    <circle cx="24" cy="35" r="4.5" fill="${c2}" stroke="#14261d" stroke-width="1.5"/>
    <path d="M60 31l3 13c1 5-3 8-8 8l-19-4M40 40h22" fill="none" stroke="#14261d" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 31l3 13c1 5-3 8-8 8l-19-4M40 40h22" fill="none" stroke="#d8dcd9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

let S = null, tab = "picks", league = "ALL", adminCode = ls.get("tb_admin") || "", auto = false;
let me = { name: ls.get("tb_name") || "", pin: ls.get("tb_pin") || "" };

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2200); }
async function api(path, body) {
  const r = await fetch("/api/" + path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
  const d = await r.json().catch(() => ({ error: "The pool didn't answer. Try again." }));
  if (!r.ok) throw new Error(d.error || "The pool didn't answer. Try again.");
  return d;
}
async function load(silent) {
  try {
    S = await api(`state?name=${encodeURIComponent(me.name)}&pin=${encodeURIComponent(me.pin)}`);
    S.skew = S.now - Date.now();
    render();
  } catch (e) { if (!silent) $("#main").innerHTML = `<div class="card"><h3>Can't reach the pool</h3><p class="note">${esc(e.message)}</p><button class="btn" id="retry">Try again</button></div>`; }
}
const now = () => Date.now() + (S?.skew || 0);
const isLocked = (g) => now() >= Date.parse(g.lock || g.ko);
const fmtKo = (g) => new Date(g.ko).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
const sp = (n) => (n > 0 ? "+" + n : n === 0 ? "Pick" : String(n));
const spreadFor = (g, side) => sp(side === "home" ? g.spread : -g.spread);
const money = (n) => "$" + n;

function cover(g) {
  const r = S.results[g.id];
  if (!r || !r.final) return null;
  const m = r.home - r.away + g.spread;
  return m > 0 ? "home" : m < 0 ? "away" : "push";
}
function standings(lg) {
  const games = S.games.filter((g) => lg === "ALL" || g.lg === lg);
  const tbActual = {};
  for (const g of S.games) if (g.tb && S.results[g.id]?.final) tbActual[g.tb] = S.results[g.id].home + S.results[g.id].away;
  const rows = S.players.map((p) => {
    let w = 0, l = 0, ps = 0;
    for (const g of games) {
      const c = cover(g); if (!c) continue;
      if (c === "push") { ps++; continue; }
      if (p.picks[g.id] === c) w++; else l++;
    }
    const d = (k) => (tbActual[k] != null && p.tb[k] != null ? Math.abs(p.tb[k] - tbActual[k]) : null);
    return { p, w, l, ps, pts: w + ps * 0.5, d1: d("tb1"), d2: d("tb2") };
  });
  const inf = (v) => (v == null ? 1e9 : v);
  rows.sort((a, b) => b.pts - a.pts || inf(a.d1) - inf(b.d1) || inf(a.d2) - inf(b.d2) || a.p.name.localeCompare(b.p.name));
  rows.forEach((r, i) => {
    const prev = rows[i - 1];
    r.rank = prev && prev.pts === r.pts && inf(prev.d1) === inf(r.d1) && inf(prev.d2) === inf(r.d2) ? prev.rank : i + 1;
  });
  return { rows, tbActual, done: games.filter(cover).length, total: games.length };
}

function renderBoard() {
  const n = S.players.length, entry = S.games.length * S.perGame;
  const nfl = S.games.filter((g) => g.lg === "NFL").length;
  $("#tag").textContent = `${nfl} NFL and ${S.games.length - nfl} college games. Pick every one against the spread.`;
  const next = S.games.find((g) => !isLocked(g));
  $("#board").innerHTML =
    `<div><small>Pot</small><b>${money(n * entry)}</b></div><div><small>Players</small><b>${n}/${S.max}</b></div>` +
    `<div class="nx"><small>${next ? "Next lock, " + fmtKo({ ko: next.lock || next.ko }) : "Picks"}</small><b>${next ? esc(next.away) + " at " + esc(next.home) : "All games locked"}</b></div>`;
}

function rules() {
  const tb = S.games.filter((g) => g.tb).map((g) => `${esc(g.away)} at ${esc(g.home)}`);
  const entry = S.games.length * S.perGame;
  return `<div class="card"><h3>How it works</h3><ul class="rules">
    <li>${money(S.perGame)} a game for ${S.games.length} games, so ${money(entry)} to play. Best record takes the pot.</li>
    <li>Your team has to cover the spread. A favorite at -3.5 must win by 4 or more; an underdog at +3.5 can lose by 3 and still cover.</li>
    <li>A cover is 1 point. Landing exactly on the number is a push, worth half a point.</li>
    <li>Each pick locks at kickoff. Nobody sees your pick before then, and a game you skip counts as a miss.</li>
    <li>Ties are broken by the closest guess at total points in ${tb[0]}, then ${tb[1]}.</li>
    <li>Lines were set ${esc(S.linesAsOf)} and don't move.</li>
  </ul></div>`;
}
function viewLogin() {
  const full = S.players.length >= S.max;
  return `<div class="card">
    <h3>${full ? "The pool is full" : "Get in the pool"}</h3>
    <p class="note">${full ? "Already playing? Enter your name and PIN to get back to your picks." : "Choose a name and a 4-digit PIN. The same two get you back in from any phone."}</p>
    <div class="row" style="margin-bottom:10px"><input id="lname" aria-label="Your name" placeholder="Your name" maxlength="18" autocomplete="nickname"><input id="lpin" aria-label="4-digit PIN" placeholder="PIN" inputmode="numeric" maxlength="4" style="max-width:104px"></div>
    <button class="btn" id="ljoin">${full ? "Sign in" : "Join the pool"}</button>
  </div>${rules()}`;
}

function gameCard(g, p) {
  const lock = isLocked(g), c = cover(g), r = S.results[g.id], mine = p.picks[g.id];
  const side = (s) => {
    let k = "side"; let tag = "Your pick";
    if (mine === s) { k += " sel"; if (c) { k += c === "push" ? " p" : c === s ? " w" : " l"; tag = c === "push" ? "Push" : c === s ? "Covered" : "Missed"; } }
    return `<button class="${k}" data-g="${g.id}" data-s="${s}" ${lock ? "disabled" : ""} aria-pressed="${mine === s}" aria-label="${esc(g[s])} ${spreadFor(g, s)}">
      ${helmet(g[s], s === "home")}<span class="t">${esc(g[s])}</span><span class="s">${spreadFor(g, s)}</span><span class="k">${tag}</span></button>`;
  };
  let foot = "";
  if (r?.final) foot = `<div class="gfoot"><span>Final: ${esc(g.away)} ${r.away}, ${esc(g.home)} ${r.home}</span>${mine ? "" : "<b>No pick</b>"}</div>`;
  else if (lock) foot = `<div class="gfoot"><span>Locked at kickoff</span>${mine ? "" : "<b>No pick</b>"}</div>`;
  const tbn = g.tb === "tb1" ? "1" : "2";
  return `<article class="game${!lock && !mine ? " todo" : ""}">
    <div class="gmeta"><span>${fmtKo(g)} ${g.lg === "NFL" ? "NFL" : "College"}${g.tv ? " on " + esc(g.tv) : ""}</span><span>Total ${g.total}</span></div>
    <div class="duel">${side("away")}${side("home")}</div>${foot}
    ${g.tb ? `<div class="tb"><label for="${g.tb}">Tiebreaker ${tbn}<span>Guess both teams' combined points</span></label><input id="${g.tb}" type="number" inputmode="numeric" min="0" max="200" data-tb="${g.tb}" value="${p.tb[g.tb] ?? ""}" ${lock ? "disabled" : ""} placeholder="${Math.round(g.total)}"></div>` : ""}
  </article>`;
}
function viewPicks() {
  const p = S.players.find((x) => x.id === S.me);
  if (!p) return viewLogin();
  const open = S.games.filter((g) => !isLocked(g)), left = open.filter((g) => !p.picks[g.id]).length;
  const tbLeft = S.games.filter((g) => g.tb && !isLocked(g) && p.tb[g.tb] == null).length;
  const status = !open.length ? "All games are locked" : left ? `${left} ${left === 1 ? "game" : "games"} left to pick` : tbLeft ? "Picks are in. Add your tiebreaker guesses" : "You're all set";
  let html = `<div class="who"><span>Playing as <b>${esc(p.name)}</b></span><button id="logout">Sign out</button></div>
    <div class="prog"><div class="bar"><i style="width:${Math.round((p.made / S.games.length) * 100)}%"></i></div><span>${status}</span></div>`;
  let day = "";
  for (const g of S.games) {
    if (g.day !== day) { day = g.day; html += `<h2>${esc(day)}</h2>`; }
    html += gameCard(g, p);
  }
  return html + rules() + `<button class="btn turf" id="share">Copy the invite link</button>`;
}

function viewBoard() {
  const { rows, tbActual, done, total } = standings(league);
  const chip = (k, t) => `<button class="${league === k ? "on" : ""}" data-lg="${k}" aria-pressed="${league === k}">${t}</button>`;
  const chips = `<div class="chips">${chip("ALL", "Overall")}${chip("NFL", "NFL")}${chip("CFB", "College")}</div>`;
  if (!S.players.length) return chips + `<div class="card"><h3>Nobody's in yet</h3><p class="note">Join from the My picks tab and you'll be first on the board.</p></div>`;
  const body = rows.map((r) => `<tr class="${r.rank === 1 && done ? "lead" : ""}">
      <td class="rk">${done ? r.rank : ""}</td>
      <td><span class="nm">${esc(r.p.name)}</span>${r.p.id === S.me ? '<span class="you">You</span>' : ""}<span class="${r.p.paid ? "paid" : "owe"}">${r.p.paid ? "Paid" : "Owes " + money(S.games.length * S.perGame)}</span></td>
      <td class="n">${r.w}-${r.l}${r.ps ? "-" + r.ps : ""}</td><td class="n pts">${r.pts}</td>
      <td class="n">${r.d1 ?? "–"}</td><td class="n">${r.d2 ?? "–"}</td></tr>`).join("");
  return chips + `<div class="card"><p class="note">${done ? `${done} of ${total} games final.` : "No finals yet. Standings fill in as games end."} ${league === "ALL" ? "First place overall takes the pot." : "This view is for bragging rights."}</p>
    <table><thead><tr><th></th><th>Player</th><th class="n">Record</th><th class="n">Points</th><th class="n">TB 1</th><th class="n">TB 2</th></tr></thead><tbody>${body}</tbody></table></div>
    <p class="onturf">TB 1 and TB 2 show how far off each tiebreaker guess was; lower is better. Actual totals: ${tbActual.tb1 ?? "not final"} and ${tbActual.tb2 ?? "not final"}.</p>`;
}

function viewAll() {
  if (!S.players.length) return `<div class="card"><h3>Nobody's in yet</h3><p class="note">Picks show up here once people join and games kick off.</p></div>`;
  const head = S.games.map((g) => `<th>${esc(g.away)}<br>${esc(g.home)} ${sp(g.spread)}</th>`).join("");
  const body = S.players.map((p) => `<tr><td><b>${esc(p.name)}</b></td>` + S.games.map((g) => {
    if (!isLocked(g)) return `<td class="gh">${p.id === S.me && p.picks[g.id] ? esc(g[p.picks[g.id]]) : p.picks[g.id] || p.made ? "Hidden" : "–"}</td>`;
    const pk = p.picks[g.id], c = cover(g);
    if (!pk) return `<td class="gl">None</td>`;
    return `<td class="${c ? (c === "push" ? "gp" : c === pk ? "gw" : "gl") : ""}">${esc(g[pk])}</td>`;
  }).join("") + `<td>${p.tb.tb1 ?? "–"} / ${p.tb.tb2 ?? "–"}</td></tr>`).join("");
  return `<div class="card"><p class="note">Everyone's picks appear when each game kicks off. Green covered, struck-through red missed.</p>
    <div class="scroll"><table class="grid"><thead><tr><th>Player</th>${head}<th>Tiebreakers</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
}

function viewAdmin() {
  if (!adminCode) return `<div class="card"><h3>Commissioner tools</h3><p class="note">Enter scores, track who has paid, and manage players.</p><div class="row"><input id="acode" aria-label="Commissioner code" placeholder="Commissioner code" autocapitalize="off" autocomplete="off"><button class="btn" id="ago" style="max-width:112px">Unlock</button></div></div>`;
  const games = S.games.map((g) => { const r = S.results[g.id];
    return `<tr><td><b>${esc(g.away)} at ${esc(g.home)}</b><span class="note" style="display:block">${r?.final ? (r.manual ? "Entered by hand" : "Filled in from ESPN") : "No final yet"}</span>
      <div class="row" style="margin-top:6px"><input type="number" inputmode="numeric" data-ra="${g.id}" value="${r?.away ?? ""}" aria-label="${esc(g.away)} score" placeholder="${esc(g.away)}"><input type="number" inputmode="numeric" data-rh="${g.id}" value="${r?.home ?? ""}" aria-label="${esc(g.home)} score" placeholder="${esc(g.home)}"><button class="btn sm" data-save="${g.id}" style="flex:0 0 auto">Save score</button></div></td></tr>`; }).join("");
  const players = S.players.map((p) => `<tr><td><b>${esc(p.name)}</b><span class="note" style="display:block">${p.made} of ${S.games.length} picks in</span>
      <div class="row" style="margin-top:6px"><button class="btn sm ${p.paid ? "" : "line"}" data-paid="${p.id}" data-v="${p.paid ? 0 : 1}">${p.paid ? "Paid" : "Mark paid"}</button><button class="btn sm line" data-pin="${p.id}">Reset PIN</button><button class="btn sm line" data-rm="${p.id}" data-nm="${esc(p.name)}">Remove</button></div></td></tr>`).join("");
  return `<div class="card"><h3>Players (${S.players.length} of ${S.max})</h3><table>${players || '<tr><td class="note">Nobody has joined yet.</td></tr>'}</table></div>
    <div class="card"><h3>Final scores</h3><p class="note">Finals fill in from ESPN on their own once a game ends, or check now with the button. A score you save here overrides that. To undo yours, clear both boxes and save.</p><button class="btn" id="fetchscores" style="margin-bottom:10px">Check ESPN for final scores</button><table>${games}</table></div>
    <button class="btn turf" id="aout">Lock commissioner tools</button>`;
}

function render() {
  if (!S) return;
  renderBoard();
  const a = document.activeElement;
  if (auto && a && a.tagName === "INPUT" && $("#main").contains(a)) return; // don't clobber typing on background refresh
  $("#main").innerHTML = { picks: viewPicks, board: viewBoard, all: viewAll, admin: viewAdmin }[tab]();
}

$("#nav").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.t;
  [...$("#nav").children].forEach((x) => (x === b ? x.setAttribute("aria-current", "page") : x.removeAttribute("aria-current")));
  render(); window.scrollTo(0, 0);
});

async function admin(action, extra, done) {
  try { await api("admin", { code: adminCode, action, ...extra }); await load(); toast(done); }
  catch (e) { toast(e.message); if (/commissioner code/i.test(e.message)) { adminCode = ""; ls.del("tb_admin"); render(); } }
}

$("#main").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "retry") return load();
  if (b.id === "ljoin") {
    const name = $("#lname").value.trim(), pin = $("#lpin").value.trim();
    try { const r = await api("join", { name, pin }); me = { name: r.name, pin }; ls.set("tb_name", r.name); ls.set("tb_pin", pin); await load(); toast("You're in, " + r.name); }
    catch (err) { toast(err.message); }
  } else if (b.id === "logout") { me = { name: "", pin: "" }; ls.del("tb_name"); ls.del("tb_pin"); load();
  } else if (b.id === "share") {
    try { await navigator.clipboard.writeText(location.origin); toast("Invite link copied"); } catch { toast(location.host); }
  } else if (b.dataset.g) {
    const p = S.players.find((x) => x.id === S.me); if (!p) return;
    const g = S.games.find((x) => x.id === b.dataset.g);
    p.picks[g.id] = b.dataset.s; p.made = Object.keys(p.picks).length;
    const y = window.scrollY; render(); window.scrollTo(0, y);
    try { const r = await api("picks", { ...me, picks: { [g.id]: b.dataset.s } }); if (r.rejected.length) { toast("That game already kicked off"); load(); } else toast(`Saved: ${g[b.dataset.s]} ${spreadFor(g, b.dataset.s)}`); }
    catch (err) { toast(err.message); load(); }
  } else if (b.dataset.lg) { league = b.dataset.lg; render();
  } else if (b.id === "ago") {
    const code = $("#acode").value.trim();
    try { await api("admin", { code, action: "check" }); adminCode = code; ls.set("tb_admin", code); render(); } catch (err) { toast(err.message); }
  } else if (b.id === "fetchscores") {
    b.disabled = true; b.textContent = "Checking ESPN…";
    try {
      const r = await api("admin", { code: adminCode, action: "refresh" });
      await load();
      toast(r.updated.length ? `Added ${r.updated.length} final ${r.updated.length === 1 ? "score" : "scores"}` : r.errors.length ? "ESPN didn't answer. Enter the score by hand" : r.pending ? "No new finals yet" : "Every started game already has a score");
    } catch (err) { toast(err.message); render(); }
  } else if (b.id === "aout") { adminCode = ""; ls.del("tb_admin"); render();
  } else if (b.dataset.save) {
    const g = b.dataset.save, a = $(`[data-ra="${g}"]`).value, h = $(`[data-rh="${g}"]`).value;
    if (a === "" && h === "") admin("clearResult", { gid: g }, "Score cleared");
    else if (a === "" || h === "") toast("Enter both scores");
    else admin("setResult", { gid: g, away: Number(a), home: Number(h) }, "Score saved");
  } else if (b.dataset.paid) { admin("setPaid", { id: b.dataset.paid, paid: b.dataset.v === "1" }, b.dataset.v === "1" ? "Marked paid" : "Marked unpaid");
  } else if (b.dataset.pin) { const pin = prompt("New 4-digit PIN for this player:"); if (pin) admin("resetPin", { id: b.dataset.pin, pin: pin.trim() }, "PIN reset");
  } else if (b.dataset.rm) { if (confirm(`Remove ${b.dataset.nm} and all of their picks?`)) admin("removePlayer", { id: b.dataset.rm }, "Player removed"); }
});
$("#main").addEventListener("change", async (e) => {
  const k = e.target.dataset.tb; if (!k) return;
  if (e.target.value === "") return;
  try { const r = await api("picks", { ...me, tb: { [k]: e.target.value } }); toast(r.rejected.length ? "That game already kicked off" : "Tiebreaker saved"); auto = true; await load(true); auto = false; }
  catch (err) { toast(err.message); }
});
$("#main").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (e.target.id === "lname" || e.target.id === "lpin") $("#ljoin").click();
  if (e.target.id === "acode") $("#ago").click();
});

load();
setInterval(async () => { auto = true; await load(true); auto = false; }, 60000);
</script>
</body>
</html>
